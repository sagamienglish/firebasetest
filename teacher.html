<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Teacher Dashboard</title>
  <style>
    :root {
      color: #172033;
      font-family: Inter, "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      background:
        radial-gradient(circle at 10% 5%, rgba(72, 112, 238, .14), transparent 28%),
        radial-gradient(circle at 90% 95%, rgba(255, 194, 51, .14), transparent 30%),
        #f4f7fb;
    }

    button, select { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .shell { width: min(1180px, 100%); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .logo { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 15px; background: #172033; color: #fff; font-size: 25px; }
    h1 { margin: 0; font-size: clamp(23px, 4vw, 32px); letter-spacing: -.03em; }
    .brand-subtitle { margin: 3px 0 0; color: #667085; font-size: 13px; }

    .card {
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 18px 55px rgba(29, 45, 78, .11);
    }

    .auth-card { width: min(460px, 100%); margin: 10vh auto 0; text-align: center; }
    .auth-icon { font-size: 42px; }
    .auth-card h2 { margin: 12px 0 8px; }
    .auth-card p { color: #667085; line-height: 1.7; }

    .primary-button, .secondary-button, .danger-button {
      min-height: 45px;
      padding: 9px 17px;
      border-radius: 12px;
      font-weight: 750;
    }

    .primary-button { border: 0; background: #315fd5; color: #fff; box-shadow: 0 8px 20px rgba(49, 95, 213, .2); }
    .secondary-button { border: 1px solid #d5dbea; background: #fff; color: #40506c; }
    .danger-button { border: 0; background: #172033; color: #fff; }
    button:disabled { cursor: wait; opacity: .58; }
    button:focus-visible, select:focus-visible { outline: 3px solid rgba(49, 95, 213, .25); outline-offset: 2px; }

    .message { margin: 16px 0 0; color: #667085; font-size: 14px; line-height: 1.6; }
    .message.error { padding: 12px; border-radius: 12px; background: #fff1f0; color: #b42318; }

    .uid-box {
      margin: 16px 0;
      padding: 12px;
      border-radius: 12px;
      background: #f2f5fb;
      color: #40506c;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
      user-select: all;
    }

    .user-actions { display: flex; align-items: center; gap: 10px; }
    .teacher-email { color: #667085; font-size: 13px; }

    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .summary-card { padding: 19px; border: 1px solid #e3e8f1; border-radius: 18px; background: #fff; }
    .summary-label { margin: 0 0 6px; color: #667085; font-size: 12px; font-weight: 700; }
    .summary-value { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.03em; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .toolbar-left { display: flex; align-items: center; gap: 10px; }
    .toolbar label { color: #667085; font-size: 13px; font-weight: 700; }

    select {
      min-height: 42px;
      padding: 8px 34px 8px 12px;
      border: 1px solid #d5dbea;
      border-radius: 11px;
      background: #fff;
      color: #273142;
    }

    .table-wrap { overflow-x: auto; border: 1px solid #e3e8f1; border-radius: 17px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 14px 15px; border-bottom: 1px solid #edf0f5; text-align: left; vertical-align: middle; }
    th { background: #f8f9fc; color: #667085; font-size: 12px; white-space: nowrap; }
    td { font-size: 13px; }
    tbody tr:last-child td { border-bottom: 0; }
    .nickname { font-weight: 800; }
    .private-info { color: #667085; overflow-wrap: anywhere; }
    .xp { color: #315fd5; font-weight: 850; white-space: nowrap; }
    .class-control { display: flex; align-items: center; gap: 8px; }
    .class-control select { min-width: 74px; }
    .save-button { min-height: 38px; padding: 7px 11px; border: 0; border-radius: 9px; background: #edf2ff; color: #315fd5; font-weight: 800; }
    .empty { padding: 34px; color: #667085; text-align: center; }

    @media (max-width: 800px) {
      body { padding: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .user-actions { width: 100%; justify-content: space-between; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="signed-out" class="card auth-card">
      <div class="auth-icon" aria-hidden="true">🏫</div>
      <h2>教員用管理画面</h2>
      <p>教員として登録されたGoogleアカウントでログインしてください。</p>
      <button id="login-button" class="primary-button" type="button">Googleでログイン</button>
      <p id="login-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="unauthorized" class="card auth-card" hidden>
      <div class="auth-icon" aria-hidden="true">🔐</div>
      <h2>教員権限がありません</h2>
      <p>下のUIDを、Firestoreの <strong>teachers</strong> コレクションへ教員として登録してください。</p>
      <div id="teacher-uid" class="uid-box"></div>
      <p class="message">ドキュメントIDをこのUIDにし、<strong>active</strong>（ブール値）を <strong>true</strong> で作成します。</p>
      <button id="unauthorized-logout-button" class="secondary-button" type="button">別のアカウントでログイン</button>
    </section>

    <section id="dashboard" hidden>
      <header class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">📊</div>
          <div>
            <h1>Teacher Dashboard</h1>
            <p class="brand-subtitle">Firebase Learning Test</p>
          </div>
        </div>
        <div class="user-actions">
          <span id="teacher-email" class="teacher-email"></span>
          <button id="logout-button" class="danger-button" type="button">ログアウト</button>
        </div>
      </header>

      <div class="summary-grid">
        <article class="summary-card"><p class="summary-label">登録ユーザー</p><p id="total-users" class="summary-value">0</p></article>
        <article class="summary-card"><p class="summary-label">学習開始</p><p id="active-users" class="summary-value">0</p></article>
        <article class="summary-card"><p class="summary-label">合計XP</p><p id="total-xp" class="summary-value">0</p></article>
        <article class="summary-card"><p class="summary-label">表示クラス</p><p id="visible-class" class="summary-value">全</p></article>
      </div>

      <section class="card">
        <div class="toolbar">
          <div class="toolbar-left">
            <label for="class-filter">クラス</label>
            <select id="class-filter">
              <option value="all">すべて</option>
              <option value="1A">1A</option>
              <option value="1B">1B</option>
              <option value="1C">1C</option>
              <option value="1D">1D</option>
            </select>
          </div>
          <button id="refresh-button" class="secondary-button" type="button">↻ 更新</button>
        </div>

        <p id="dashboard-message" class="message" role="status" aria-live="polite">データを読み込んでいます…</p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ニックネーム</th>
                <th>Googleアカウント</th>
                <th>クラス変更</th>
                <th>XP</th>
                <th>最終更新</th>
              </tr>
            </thead>
            <tbody id="student-rows"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAtTSShVb_dG6vfIf6t1YV3wm_yoz1wkaI",
      authDomain: "fir-learning-test-879b7.firebaseapp.com",
      projectId: "fir-learning-test-879b7",
      storageBucket: "fir-learning-test-879b7.firebasestorage.app",
      messagingSenderId: "728926715604",
      appId: "1:728926715604:web:dc0dda4b18271a44588541"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const signedOut = document.getElementById("signed-out");
    const unauthorized = document.getElementById("unauthorized");
    const dashboard = document.getElementById("dashboard");
    const loginButton = document.getElementById("login-button");
    const logoutButton = document.getElementById("logout-button");
    const unauthorizedLogoutButton = document.getElementById("unauthorized-logout-button");
    const loginMessage = document.getElementById("login-message");
    const dashboardMessage = document.getElementById("dashboard-message");
    const teacherUid = document.getElementById("teacher-uid");
    const teacherEmail = document.getElementById("teacher-email");
    const classFilter = document.getElementById("class-filter");
    const refreshButton = document.getElementById("refresh-button");
    const studentRows = document.getElementById("student-rows");
    const totalUsers = document.getElementById("total-users");
    const activeUsers = document.getElementById("active-users");
    const totalXp = document.getElementById("total-xp");
    const visibleClass = document.getElementById("visible-class");

    let students = [];

    function setBusy(button, busy) {
      button.disabled = busy;
      button.setAttribute("aria-busy", String(busy));
    }

    function friendlyError(error) {
      const messages = {
        "auth/popup-closed-by-user": "ログイン画面が閉じられました。",
        "auth/popup-blocked": "ポップアップを許可してから、もう一度お試しください。",
        "auth/unauthorized-domain": "このURLがFirebaseで承認されていません。",
        "permission-denied": "この操作を行う教員権限がありません。",
        "unavailable": "Firebaseへ接続できませんでした。少し待ってから再度お試しください。"
      };
      return messages[error.code] || `エラーが発生しました（${error.code || "unknown"}）`;
    }

    function formatDate(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") return "－";
      return new Intl.DateTimeFormat("ja-JP", {
        month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
      }).format(timestamp.toDate());
    }

    function createClassSelect(currentClass) {
      const select = document.createElement("select");
      for (const classId of ["1A", "1B", "1C", "1D"]) {
        const option = document.createElement("option");
        option.value = classId;
        option.textContent = classId;
        option.selected = classId === currentClass;
        select.appendChild(option);
      }
      return select;
    }

    async function saveClass(uid, newClass, button) {
      setBusy(button, true);
      const oldText = button.textContent;
      button.textContent = "保存中";
      try {
        await db.collection("users").doc(uid).update({
          classId: newClass,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        dashboardMessage.className = "message";
        dashboardMessage.textContent = `クラスを${newClass}へ変更しました。`;
        await loadStudents();
      } catch (error) {
        dashboardMessage.className = "message error";
        dashboardMessage.textContent = friendlyError(error);
      } finally {
        button.textContent = oldText;
        setBusy(button, false);
      }
    }

    function renderStudents() {
      const selectedClass = classFilter.value;
      const filtered = students
        .filter((student) => selectedClass === "all" || student.classId === selectedClass)
        .sort((a, b) => b.xp - a.xp || a.nickname.localeCompare(b.nickname, "ja"));

      totalUsers.textContent = filtered.length;
      activeUsers.textContent = filtered.filter((student) => student.xp > 0).length;
      totalXp.textContent = filtered.reduce((sum, student) => sum + student.xp, 0);
      visibleClass.textContent = selectedClass === "all" ? "全" : selectedClass;
      studentRows.replaceChildren();

      if (filtered.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 5;
        cell.className = "empty";
        cell.textContent = "該当するユーザーはいません。";
        row.appendChild(cell);
        studentRows.appendChild(row);
        return;
      }

      for (const student of filtered) {
        const row = document.createElement("tr");

        const nicknameCell = document.createElement("td");
        nicknameCell.className = "nickname";
        nicknameCell.textContent = student.nickname;

        const privateCell = document.createElement("td");
        privateCell.className = "private-info";
        const privateText = [student.displayName, student.email].filter(Boolean).join(" / ");
        privateCell.textContent = privateText || "次回ログイン後に取得";

        const classCell = document.createElement("td");
        const classControl = document.createElement("div");
        classControl.className = "class-control";
        const select = createClassSelect(student.classId);
        const saveButton = document.createElement("button");
        saveButton.type = "button";
        saveButton.className = "save-button";
        saveButton.textContent = "変更";
        saveButton.addEventListener("click", () => saveClass(student.uid, select.value, saveButton));
        classControl.append(select, saveButton);
        classCell.appendChild(classControl);

        const xpCell = document.createElement("td");
        xpCell.className = "xp";
        xpCell.textContent = `${student.xp} XP`;

        const updatedCell = document.createElement("td");
        updatedCell.textContent = formatDate(student.updatedAt);

        row.append(nicknameCell, privateCell, classCell, xpCell, updatedCell);
        studentRows.appendChild(row);
      }
    }

    async function loadStudents() {
      setBusy(refreshButton, true);
      dashboardMessage.className = "message";
      dashboardMessage.textContent = "データを読み込んでいます…";
      try {
        const [publicSnapshot, privateSnapshot] = await Promise.all([
          db.collection("users").get(),
          db.collection("privateUsers").get()
        ]);

        const privateByUid = new Map(privateSnapshot.docs.map((doc) => [doc.id, doc.data()]));
        students = publicSnapshot.docs.map((doc) => {
          const publicData = doc.data();
          const privateData = privateByUid.get(doc.id) || {};
          return {
            uid: doc.id,
            nickname: publicData.nickname || "名無しユーザー",
            classId: publicData.classId || "1A",
            xp: Number(publicData.xp) || 0,
            updatedAt: publicData.updatedAt,
            email: privateData.email || "",
            displayName: privateData.displayName || ""
          };
        });

        renderStudents();
        dashboardMessage.textContent = `${students.length}人のデータを読み込みました。`;
      } catch (error) {
        dashboardMessage.className = "message error";
        dashboardMessage.textContent = friendlyError(error);
      } finally {
        setBusy(refreshButton, false);
      }
    }

    async function checkTeacher(user) {
      signedOut.hidden = true;
      unauthorized.hidden = true;
      dashboard.hidden = true;
      try {
        const teacherDoc = await db.collection("teachers").doc(user.uid).get();
        if (!teacherDoc.exists || teacherDoc.data().active !== true) {
          teacherUid.textContent = user.uid;
          unauthorized.hidden = false;
          return;
        }

        teacherEmail.textContent = user.email || "教員アカウント";
        dashboard.hidden = false;
        await db.collection("privateUsers").doc(user.uid).set({
          email: user.email || "",
          displayName: user.displayName || "",
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        await loadStudents();
      } catch (error) {
        signedOut.hidden = false;
        loginMessage.className = "message error";
        loginMessage.textContent = friendlyError(error);
      }
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        checkTeacher(user);
      } else {
        signedOut.hidden = false;
        unauthorized.hidden = true;
        dashboard.hidden = true;
      }
    });

    loginButton.addEventListener("click", async () => {
      setBusy(loginButton, true);
      loginMessage.className = "message";
      loginMessage.textContent = "Googleログイン画面を開いています…";
      try {
        await auth.signInWithPopup(provider);
      } catch (error) {
        loginMessage.className = "message error";
        loginMessage.textContent = friendlyError(error);
      } finally {
        setBusy(loginButton, false);
      }
    });

    logoutButton.addEventListener("click", () => auth.signOut());
    unauthorizedLogoutButton.addEventListener("click", () => auth.signOut());
    refreshButton.addEventListener("click", loadStudents);
    classFilter.addEventListener("change", renderStudents);
  </script>
</body>
</html>
